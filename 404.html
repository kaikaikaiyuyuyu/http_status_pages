<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #e8e2d6;
      color: #070707;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,.15) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,.12) 0 1px, transparent 1px);
      background-size: 4px 4px, 6px 6px;
      mix-blend-mode: multiply;
      z-index: 10;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 4vw;
      overflow: hidden;
    }

    .main-text {
      position: relative;
      z-index: 2;
      font-size: clamp(72px, 13vw, 190px);
      line-height: 0.82;
      letter-spacing: -0.08em;
      font-weight: 900;
      text-transform: uppercase;
      max-width: 900px;
    }

    .main-text span {
      display: block;
    }

    .gray {
      color: rgba(0, 0, 0, 0.55);
    }

    .number {
      position: absolute;
      right: 7vw;
      bottom: 4vw;
      font-size: clamp(80px, 15vw, 210px);
      line-height: 0.8;
      font-weight: 900;
      letter-spacing: -0.08em;
      z-index: 2;
    }

    .blur {
      position: absolute;
      width: 45vw;
      height: 45vw;
      right: 16vw;
      top: 32vh;
      background: radial-gradient(circle, rgba(0,0,0,0.75), rgba(0,0,0,0.3) 34%, transparent 68%);
      filter: blur(28px);
      opacity: 0.75;
      z-index: 1;
    }

    .circle {
      position: absolute;
      border: 1px solid rgba(0,0,0,.35);
      border-radius: 50%;
      z-index: 3;
    }

    .circle.big {
      width: 34vw;
      height: 34vw;
      top: 13vh;
      left: 38vw;
    }

    .circle.small {
      width: 22vw;
      height: 22vw;
      left: -5vw;
      top: 42vh;
    }

    .circle.mid {
      width: 25vw;
      height: 25vw;
      right: 27vw;
      bottom: 9vh;
      border-color: rgba(0,0,0,.25);
    }

    .side-info {
      position: absolute;
      right: 4vw;
      top: 8vh;
      width: 190px;
      z-index: 5;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .side-info .slash {
      position: absolute;
      right: 0;
      top: -36px;
      font-size: 18px;
    }

    .line {
      width: 100%;
      height: 1px;
      background: #111;
      margin: 18px 0;
    }

    .barcode {
      margin-top: 35px;
      width: 115px;
      height: 45px;
      background: repeating-linear-gradient(
        90deg,
        #111 0 2px,
        transparent 2px 5px,
        #111 5px 7px,
        transparent 7px 11px
      );
    }

    .vertical {
      position: absolute;
      right: 3.2vw;
      top: 42vh;
      writing-mode: vertical-rl;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      z-index: 5;
    }

    .vertical span {
      margin-bottom: 34px;
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #111;
      border-radius: 50%;
      margin: 18px 0;
    }

    .bottom-left {
      position: absolute;
      left: 4vw;
      bottom: 6vh;
      z-index: 5;
      width: 240px;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 800;
      text-transform: uppercase;
    }

    .bottom-left .mini-line {
      width: 120px;
      height: 2px;
      background: #111;
      margin-bottom: 12px;
    }

    .bottom-right {
      position: absolute;
      right: 11vw;
      bottom: 10vh;
      z-index: 5;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 800;
      text-transform: uppercase;
      width: 180px;
    }

    .thin-line {
      position: absolute;
      right: 2vw;
      bottom: 4vh;
      width: 220px;
      height: 1px;
      background: #111;
      transform: rotate(-48deg);
      transform-origin: right center;
      z-index: 4;
    }

    .back {
      position: absolute;
      left: 50%;
      bottom: 5vh;
      transform: translateX(-50%);
      z-index: 8;
      color: #111;
      text-decoration: none;
      border: 1px solid #111;
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: 0.25s;
      background: rgba(232, 226, 214, 0.7);
      backdrop-filter: blur(6px);
    }

    .back:hover {
      background: #111;
      color: #e8e2d6;
    }

    .globe {
      position: absolute;
      right: 21vw;
      bottom: 17vh;
      width: 70px;
      height: 34px;
      border: 1px solid #111;
      border-radius: 50%;
      z-index: 5;
    }

    .globe::before,
    .globe::after {
      content: "";
      position: absolute;
      inset: 6px 14px;
      border: 1px solid #111;
      border-radius: 50%;
    }

    .globe::after {
      inset: 14px 0;
      border-left: none;
      border-right: none;
      border-radius: 0;
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 8vw;
      }

      .main-text {
        font-size: clamp(58px, 22vw, 120px);
      }

      .number {
        position: relative;
        right: auto;
        bottom: auto;
        margin-top: 30px;
        font-size: 110px;
      }

      .side-info,
      .vertical,
      .bottom-right,
      .globe,
      .thin-line {
        display: none;
      }

      .bottom-left {
        position: relative;
        left: auto;
        bottom: auto;
        margin-top: 40px;
      }

      .back {
        position: relative;
        display: inline-block;
        left: auto;
        bottom: auto;
        transform: none;
        margin-top: 30px;
      }

      .blur {
        width: 90vw;
        height: 90vw;
        right: -20vw;
        top: 35vh;
      }

      .circle.big {
        width: 70vw;
        height: 70vw;
        left: 35vw;
        top: 20vh;
      }

      .circle.small {
        width: 55vw;
        height: 55vw;
        top: 48vh;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="blur"></div>

    <div class="circle big"></div>
    <div class="circle small"></div>
    <div class="circle mid"></div>

    <main class="main-text">
      <span>404</span>
      <span>NOT</span>
      <span>FOUND</span>
      <span class="gray">PAGE</span>
    </main>

    <div class="number">
      40<br />4
    </div>

    <section class="side-info">
      <div class="slash">25 /</div>
      <p>THE PAGE YOU ARE LOOKING FOR</p>
      <div class="line"></div>
      <p>DOES NOT EXIST OR HAS BEEN MOVED.</p>
      <div class="barcode"></div>
    </section>

    <div class="vertical">
      <span>ERROR</span>
      <span class="dot"></span>
      <span>CLARITY</span>
      <span class="dot"></span>
      <span>RETURN</span>
    </div>

    <section class="bottom-left">
      <div class="mini-line"></div>
      <p>EVERY BROKEN LINK<br />SHOULD LEAD SOMEWHERE.</p>
      <br />
      <p>KEEP IT SIMPLE,<br />BUT MAKE IT MEAN SOMETHING.</p>
    </section>

    <div class="globe"></div>

    <section class="bottom-right">
      <p>404 WITH INTENTION.<br />BUILD WITH PURPOSE.</p>
    </section>

    <div class="thin-line"></div>

    <a href="/" class="back">Back to Home</a>

    <div class="noise"></div>
  </div>
</body>
</html>
