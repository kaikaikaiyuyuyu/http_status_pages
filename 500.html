<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 Internal Server Error</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #030403;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 43% 58%, rgba(255, 91, 143, 0.13), transparent 24%),
        radial-gradient(circle at 52% 70%, rgba(88, 255, 186, 0.12), transparent 22%),
        radial-gradient(circle at 65% 45%, rgba(86, 120, 255, 0.08), transparent 28%),
        #030403;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: .22;
      z-index: 1;
    }

    .noise {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: .16;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1px);
      background-size: 4px 4px;
      mix-blend-mode: overlay;
    }

    .scan {
      position: absolute;
      inset: 0;
      z-index: 49;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,.04) 0,
        rgba(255,255,255,.04) 1px,
        transparent 1px,
        transparent 5px
      );
      opacity: .08;
    }

    .composition {
      position: absolute;
      left: 50%;
      top: 51%;
      width: min(780px, 92vw);
      height: min(880px, 94vh);
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    .title {
      position: absolute;
      left: 6vw;
      top: 6vh;
      z-index: 30;
      text-transform: uppercase;
      font-size: clamp(52px, 10vw, 145px);
      line-height: .78;
      letter-spacing: -0.08em;
      font-weight: 900;
      color: rgba(255,255,255,.94);
      mix-blend-mode: screen;
    }

    .title span {
      display: block;
    }

    .title .pink {
      color: rgba(255, 85, 137, .88);
      text-shadow: 0 0 24px rgba(255, 85, 137, .38);
    }

    .title .green {
      color: rgba(111, 255, 178, .86);
      text-shadow: 0 0 24px rgba(111, 255, 178, .35);
    }

    .code {
      position: absolute;
      right: 6vw;
      bottom: 5vh;
      z-index: 30;
      font-size: clamp(86px, 16vw, 220px);
      line-height: .75;
      letter-spacing: -0.1em;
      font-weight: 900;
      color: rgba(255,255,255,.08);
      -webkit-text-stroke: 1px rgba(255,255,255,.45);
    }

    .message {
      position: absolute;
      right: 6vw;
      top: 13vh;
      width: 320px;
      z-index: 31;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: rgba(255,255,255,.86);
    }

    .message::before {
      content: "";
      display: block;
      width: 92px;
      height: 2px;
      background: #72ffb0;
      margin-bottom: 18px;
      box-shadow: 0 0 18px rgba(114,255,176,.8);
    }

    .jp-message {
      position: absolute;
      left: 6vw;
      bottom: 8vh;
      z-index: 31;
      max-width: 420px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.045);
      backdrop-filter: blur(10px);
      font-size: clamp(15px, 2vw, 22px);
      line-height: 1.55;
      font-weight: 800;
      color: rgba(255,255,255,.9);
      box-shadow:
        0 0 24px rgba(255, 91, 143, .14),
        inset 0 0 28px rgba(111, 255, 178, .04);
    }

    .stem {
      position: absolute;
      width: 5px;
      height: 520px;
      left: 50%;
      top: 12%;
      transform-origin: bottom center;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(120,255,185,.82),
        rgba(120,255,185,.32),
        transparent
      );
      border-radius: 50%;
      filter: drop-shadow(0 0 8px rgba(96,255,173,.7));
      z-index: 12;
    }

    .stem.main {
      transform: translateX(-50%) rotate(-12deg);
    }

    .stem.second {
      height: 420px;
      left: 57%;
      top: 25%;
      transform: rotate(43deg);
      opacity: .75;
    }

    .stem.third {
      height: 360px;
      left: 39%;
      top: 28%;
      transform: rotate(-54deg);
      opacity: .65;
    }

    .stem.fourth {
      height: 330px;
      left: 49%;
      top: 39%;
      transform: rotate(20deg);
      opacity: .7;
    }

    .flower {
      position: absolute;
      width: 290px;
      height: 290px;
      z-index: 18;
      filter:
        drop-shadow(0 0 26px rgba(255, 89, 145, .36))
        drop-shadow(0 0 16px rgba(111, 255, 178, .24));
      opacity: .95;
    }

    .flower.one {
      left: 32%;
      top: 36%;
      transform: rotate(-12deg);
    }

    .flower.two {
      left: 46%;
      top: 57%;
      transform: rotate(18deg) scale(.94);
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 92px;
      height: 160px;
      background:
        radial-gradient(circle at 45% 30%, rgba(255,255,255,.85), transparent 18%),
        linear-gradient(145deg, rgba(255,170,202,.94), rgba(255,69,132,.68) 42%, rgba(118,255,194,.34));
      border-radius: 80% 20% 70% 30%;
      transform-origin: 0 0;
      opacity: .86;
      mix-blend-mode: screen;
    }

    .petal.p1 { transform: rotate(0deg) translate(-8px, -145px); }
    .petal.p2 { transform: rotate(60deg) translate(-8px, -145px); }
    .petal.p3 { transform: rotate(120deg) translate(-8px, -145px); }
    .petal.p4 { transform: rotate(180deg) translate(-8px, -145px); }
    .petal.p5 { transform: rotate(240deg) translate(-8px, -145px); }
    .petal.p6 { transform: rotate(300deg) translate(-8px, -145px); }

    .core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.95), rgba(112,255,189,.85) 38%, rgba(255,87,143,.35) 70%);
      box-shadow:
        0 0 26px rgba(112,255,189,.85),
        0 0 50px rgba(255,87,143,.42);
      z-index: 3;
    }

    .square {
      position: absolute;
      z-index: 20;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(2px);
      mix-blend-mode: screen;
    }

    .square.pink {
      background: rgba(255, 87, 138, .68);
      box-shadow: 0 0 26px rgba(255, 87, 138, .25);
    }

    .square.green {
      background: rgba(106, 255, 175, .62);
      box-shadow: 0 0 26px rgba(106, 255, 175, .25);
    }

    .square.blue {
      background: rgba(89, 123, 154, .66);
      box-shadow: 0 0 26px rgba(89, 123, 154, .24);
    }

    .s1 {
      left: 29%;
      top: 13%;
      width: 54px;
      height: 54px;
    }

    .s2 {
      left: 33%;
      top: 22%;
      width: 72px;
      height: 72px;
    }

    .s3 {
      left: 36%;
      top: 36%;
      width: 155px;
      height: 155px;
    }

    .s4 {
      left: 49%;
      top: 44%;
      width: 120px;
      height: 120px;
    }

    .s5 {
      left: 55%;
      top: 63%;
      width: 160px;
      height: 160px;
    }

    .s6 {
      left: 35%;
      top: 70%;
      width: 145px;
      height: 145px;
    }

    .s7 {
      left: 52%;
      top: 82%;
      width: 95px;
      height: 95px;
    }

    .s8 {
      right: 21%;
      top: 34%;
      width: 42px;
      height: 42px;
    }

    .s9 {
      right: 15%;
      top: 42%;
      width: 64px;
      height: 64px;
    }

    .s10 {
      right: 10%;
      top: 57%;
      width: 132px;
      height: 132px;
    }

    .s11 {
      left: 53%;
      top: 12%;
      width: 36px;
      height: 36px;
    }

    .s12 {
      right: 19%;
      top: 22%;
      width: 28px;
      height: 28px;
    }

    .node {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #76ffb5;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(118,255,181,.9);
      z-index: 22;
    }

    .n1 { left: 30%; top: 20%; }
    .n2 { left: 37%; top: 28%; }
    .n3 { left: 43%; top: 33%; }
    .n4 { left: 59%; top: 39%; }
    .n5 { left: 66%; top: 45%; }
    .n6 { left: 50%; top: 58%; }
    .n7 { left: 42%; top: 72%; }
    .n8 { left: 57%; top: 78%; }

    .line {
      position: absolute;
      height: 1px;
      background: rgba(118,255,181,.55);
      transform-origin: left center;
      box-shadow: 0 0 10px rgba(118,255,181,.5);
      z-index: 11;
    }

    .l1 {
      left: 30%;
      top: 20%;
      width: 180px;
      transform: rotate(28deg);
    }

    .l2 {
      left: 39%;
      top: 34%;
      width: 260px;
      transform: rotate(-18deg);
    }

    .l3 {
      left: 47%;
      top: 59%;
      width: 210px;
      transform: rotate(34deg);
    }

    .l4 {
      left: 34%;
      top: 72%;
      width: 190px;
      transform: rotate(-8deg);
    }

    .barcode {
      position: absolute;
      right: 6vw;
      bottom: 27vh;
      width: 120px;
      height: 42px;
      z-index: 32;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.88) 0 2px,
        transparent 2px 5px,
        rgba(255,255,255,.88) 5px 7px,
        transparent 7px 11px
      );
      opacity: .58;
    }

    .back {
      position: absolute;
      left: 50%;
      bottom: 5vh;
      transform: translateX(-50%);
      z-index: 40;
      text-decoration: none;
      color: #f4f4f4;
      border: 1px solid rgba(255,255,255,.42);
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(10px);
      padding: 13px 26px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: .25s;
    }

    .back:hover {
      color: #030403;
      background: #72ffb0;
      border-color: #72ffb0;
      box-shadow: 0 0 28px rgba(114,255,176,.55);
    }

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
        overflow: hidden;
      }

      .composition {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100vw;
        height: 820px;
        margin-top: 12vh;
      }

      .title {
        left: 7vw;
        top: 5vh;
        font-size: clamp(48px, 17vw, 92px);
      }

      .message {
        display: none;
      }

      .jp-message {
        position: relative;
        left: 7vw;
        bottom: auto;
        margin-top: 20px;
        max-width: 86vw;
      }

      .code {
        right: 5vw;
        bottom: 3vh;
        font-size: 96px;
      }

      .barcode {
        display: none;
      }

      .back {
        position: relative;
        left: 7vw;
        bottom: auto;
        transform: none;
        display: inline-block;
        margin: 34px 0 60px;
      }

      .flower {
        width: 230px;
        height: 230px;
      }

      .flower.one {
        left: 22%;
        top: 34%;
      }

      .flower.two {
        left: 42%;
        top: 57%;
      }

      .s3 {
        left: 22%;
        width: 130px;
        height: 130px;
      }

      .s5 {
        left: 50%;
        width: 130px;
        height: 130px;
      }

      .s10 {
        right: 4%;
        width: 105px;
        height: 105px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="title">
      <span>500</span>
      <span class="pink">INTERNAL</span>
      <span class="green">SERVER</span>
      <span>ERROR</span>
    </h1>

    <section class="message">
      Something broke inside the server.
      The request reached us, but the system could not complete it.
    </section>

    <section class="jp-message">
      サーバー内部でエラーが発生しました。<br />
      しばらく時間をおいてから、もう一度アクセスしてください。
    </section>

    <div class="composition">
      <div class="stem main"></div>
      <div class="stem second"></div>
      <div class="stem third"></div>
      <div class="stem fourth"></div>

      <div class="line l1"></div>
      <div class="line l2"></div>
      <div class="line l3"></div>
      <div class="line l4"></div>

      <div class="square green s1"></div>
      <div class="square green s2"></div>
      <div class="square pink s3"></div>
      <div class="square pink s4"></div>
      <div class="square blue s5"></div>
      <div class="square green s6"></div>
      <div class="square green s7"></div>
      <div class="square green s8"></div>
      <div class="square green s9"></div>
      <div class="square pink s10"></div>
      <div class="square green s11"></div>
      <div class="square green s12"></div>

      <div class="flower one">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="core"></div>
      </div>

      <div class="flower two">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="core"></div>
      </div>

      <div class="node n1"></div>
      <div class="node n2"></div>
      <div class="node n3"></div>
      <div class="node n4"></div>
      <div class="node n5"></div>
      <div class="node n6"></div>
      <div class="node n7"></div>
      <div class="node n8"></div>
    </div>

    <div class="barcode"></div>

    <div class="code">
      500
    </div>

    <a href="/" class="back">Back to Home</a>

    <div class="scan"></div>
    <div class="noise"></div>
  </main>
</body>
</html>
